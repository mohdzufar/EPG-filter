name: Generate Filtered EPG

on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: 'URL of the M3U playlist (raw file)'
        required: true
        default: 'https://raw.githubusercontent.com/mohdzufar/IPTV/main/Channels/Flatten.m3u8'
  schedule:
    - cron: '0 3 * * *'   # runs daily at 03:00 UTC with the default playlist

jobs:
  filter-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (for the Python script)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set playlist URL
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "PLAYLIST_URL=${{ github.event.inputs.playlist_url }}" >> $GITHUB_ENV
          else
            # Default playlist for scheduled runs – change this to whatever you want
            echo "PLAYLIST_URL=https://raw.githubusercontent.com/mohdzufar/IPTV/main/Channels/Flatten.m3u8" >> $GITHUB_ENV
          fi

      - name: Filter and compress EPG
        run: |
          python filter_epg.py "$PLAYLIST_URL" \
            "https://raw.githubusercontent.com/mohdzufar/IPTV/refs/heads/main/EPG/epg.xml.gz" \
            "https://iptv-org.github.io/epg/guides/all.xml.gz" \
            "https://epgshare01.online/epgshare01/epg_ripper_ALL_SOURCES1.xml.gz" \
            -o EPG.xml.gz

      - name: Upload artifact (so you can download manually)
        uses: actions/upload-artifact@v4
        with:
          name: filtered-epg
          path: EPG.xml.gz

      - name: Deploy to GitHub Pages (public permanent URL)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: false   # only the latest EPG.xml.gz will be published
