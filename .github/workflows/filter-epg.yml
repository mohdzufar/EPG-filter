name: Generate Filtered EPG and Store in Repo

on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: 'URL of the M3U playlist (raw file)'
        required: true
        default: 'https://raw.githubusercontent.com/mohdzufar/IPTV/main/Channels/Flatten.m3u8'
  schedule:
    - cron: '0 3 * * *'   # daily at 03:00 UTC

permissions:
  contents: write

jobs:
  filter-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set playlist URL
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "PLAYLIST_URL=${{ github.event.inputs.playlist_url }}" >> $GITHUB_ENV
          else
            echo "PLAYLIST_URL=https://raw.githubusercontent.com/mohdzufar/IPTV/main/Channels/Flatten.m3u8" >> $GITHUB_ENV
          fi

      - name: Filter and compress EPG
        run: |
          python filter_epg.py "$PLAYLIST_URL" \
            --sources EPG_Sources.txt \
            -o EPG.xml.gz

      - name: Commit and push EPG.xml.gz to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add EPG.xml.gz
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update filtered EPG [skip ci]"
            git push
          fi
