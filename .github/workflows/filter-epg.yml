name: Generate Filtered EPG

on:
  workflow_dispatch:
    inputs:
      playlist_url:
        description: 'URL of the M3U playlist (raw file)'
        required: true
        default: 'https://raw.githubusercontent.com/mohdzufar/IPTV/main/Channels/Flatten.m3u8'
  # Optional: run daily with the default playlist
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC daily

jobs:
  filter-epg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (for the Python script)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set playlist URL (use input if available, otherwise default)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "PLAYLIST_URL=${{ github.event.inputs.playlist_url }}" >> $GITHUB_ENV
          else
            # Default URL for scheduled runs (change if needed)
            echo "PLAYLIST_URL=https://raw.githubusercontent.com/mohdzufar/IPTV/main/Channels/Flatten.m3u8" >> $GITHUB_ENV
          fi

      - name: Filter EPG
        run: |
          python filter_epg.py "$PLAYLIST_URL" \
            "https://raw.githubusercontent.com/mohdzufar/IPTV/refs/heads/main/EPG/epg.xml.gz" \
            "https://iptv-org.github.io/epg/guides/all.xml.gz" \
            "https://epgshare01.online/epgshare01/epg_ripper_ALL_SOURCES1.xml.gz" \
            -o EPG.xml.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: filtered-epg
          path: EPG.xml.gz
